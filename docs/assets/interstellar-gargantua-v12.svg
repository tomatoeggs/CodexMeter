<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <linearGradient id="floorVeil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".3" stop-color="#000" stop-opacity=".58"/><stop offset="1" stop-color="#000"/></linearGradient>
    <linearGradient id="topLeftPocket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".95"/><stop offset=".55" stop-color="#000" stop-opacity=".52"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <style>
      @font-face{font-family:'Gundam Display';src:url('../../firmware/data/fonts/Teko-SemiBold.ttf') format('truetype');font-weight:600}
      @font-face{font-family:'Gundam Label';src:url('../../firmware/data/fonts/D-DINCondensed-Bold.ttf') format('truetype');font-weight:700}
      .display{font-family:'Gundam Display','DIN Condensed',sans-serif;font-weight:600;font-variant-numeric:tabular-nums}
      .label{font-family:'Gundam Label','DIN Condensed',sans-serif;font-weight:700;letter-spacing:1.15px}
      .unit{font-family:'Gundam Label','DIN Condensed',sans-serif;font-weight:700;letter-spacing:0}
    </style>
  </defs>

  <rect width="480" height="480" rx="28" fill="#000"/>

  <!-- The black hole moves back toward centre and is no longer veiled on the left. -->
  <g transform="translate(300 232) rotate(-13) scale(1.48) translate(-240 -240)"><image href="interstellar-gargantua-v8-background.png" width="480" height="480"/></g>
  <rect width="190" height="165" fill="url(#topLeftPocket)"/>
  <rect y="286" width="480" height="194" fill="url(#floorVeil)"/>

  <!-- Usage cluster: both token readings stay together in the upper-left. -->
  <text x="20" y="28" class="label" fill="#efc4b1" font-size="22">TODAY TOKEN</text>
  <text x="18" y="89" class="display" fill="#efc4b1" font-size="68">96.2</text>
  <text x="158" y="89" class="unit" fill="#efc4b1" font-size="34">M</text>
  <text x="20" y="144" class="label" fill="#efc4b1" font-size="22">7 DAYS</text>
  <text x="18" y="192" class="display" fill="#efc4b1" font-size="50">347</text>
  <text x="108" y="192" class="unit" fill="#efc4b1" font-size="31">M</text>

  <!-- Battery gets a quiet, dedicated corner. -->
  <g transform="translate(380 18)" fill="none" stroke="#d9aa95" stroke-width="2.5"><rect width="31" height="17" rx="3"/><path d="M32 5h4v7h-4"/><rect x="4" y="4" width="22" height="9" fill="#d9aa95" stroke="none"/></g>
  <text x="423" y="35" class="display" fill="#efc4b1" font-size="22">87%</text>

  <!-- Remaining quota stays dominant in the lower-left. -->
  <text x="20" y="367" class="label" fill="#efc4b1" font-size="22">7D REMAINS</text>
  <text x="13" y="462" class="display" fill="#efc4b1" font-size="118">83</text>
  <text x="145" y="453" class="unit" fill="#efc4b1" font-size="41">%</text>

  <!-- Reset and tasks occupy the residual lower-right field. -->
  <text x="460" y="367" text-anchor="end" class="label" fill="#efc4b1" font-size="22">RESET</text>
  <text x="460" y="406" text-anchor="end" class="display" fill="#efc4b1" font-size="38">06D 14H</text>
  <path d="M304 422H460" stroke="#4b3a35" stroke-width="2"/>
  <text x="460" y="462" text-anchor="end">
    <tspan class="display" fill="#efc4b1" font-size="34">02</tspan>
    <tspan dx="10" class="label" fill="#efc4b1" font-size="24">TASKS</tspan>
  </text>

  <rect width="480" height="480" rx="28" fill="none" stroke="#1c1715" stroke-width="2"/>
</svg>
